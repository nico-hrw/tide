<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App UI mit animiertem Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Fester Widget-Anker: 114x114px, 16px Rand nach oben und rechts */
    .widget-anchor {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 114px;
      height: 114px;
      z-index: 30;
    }

    /* Alle Quadrate teilen sich denselben geometrischen Raum */
    .square-layer {
      position: absolute;
      top: 0;
      right: 0;
      width: 114px;
      height: 114px;
      border-radius: 26px;
      transform-origin: center center;
      will-change: transform, opacity;
      contain: layout style paint;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Elastischer Feder-Übergang AUSSCHLIESSLICH für die Breite (kein Konflikt mit JS-Transform) */
    .spring-transition {
      transition: width 0.65s cubic-bezier(0.34, 1.45, 0.54, 1);
    }

    /* 
      Basis-Widget:
      Ruhezustand: 114px
      Expandiert: exakt 342px
    */
    #baseSquare {
      right: 0;
      left: auto;
      width: 114px;
      height: 114px;
    }

    #baseSquare.expanded {
      width: 342px;
    }

    /* Text-Slide-Animationen */
    .idle-text-transition {
      transition: transform 0.5s cubic-bezier(0.34, 1.35, 0.54, 1), 
                  opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .welcome-text-transition {
      transition: transform 0.55s cubic-bezier(0.34, 1.4, 0.54, 1), 
                  opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .text-slide-out {
      opacity: 0 !important;
      transform: translate3d(24px, 0, 0) scale(0.95) !important;
      pointer-events: none;
    }

    .text-welcome-hidden {
      opacity: 0;
      transform: translate3d(-24px, 0, 0) scale(0.95);
      pointer-events: none;
    }

    .text-welcome-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: auto;
    }
    
    /* Sanfter Kaskaden-Übergang für die UI-Elemente bei der Startsequenz */
    .intro-item {
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-neutral-100 min-h-screen flex items-center justify-center p-4 md:p-8 select-none">

  <div class="flex flex-row items-start justify-center gap-8">
    
    <!-- Smartphone App-Screen (Breite: 390px) -->
    <div class="relative w-[390px] h-[812px] bg-white rounded-[44px] shadow-2xl overflow-hidden border-[8px] border-neutral-900 flex flex-col justify-between flex-shrink-0">
      
      <!-- OBERER BEREICH MIT HEADER & WIDGET -->
      <div class="relative pt-6 px-4">
        
        <!-- Header Text -->

          </h1>
          <p id="monthHeader" class="intro-item text-[14px] font-black text-neutral-900 tracking-wider uppercase">JULI 2026</p>
        </div>

        <!-- ANIMIERTES WIDGET -->
        <div id="widgetContainer" class="intro-item widget-anchor pointer-events-none">
          
          <!-- Hintergrund 1: Navy-Blau -->
          <div 
            id="navySquare" 
            class="square-layer bg-[#001f3f] shadow-lg shadow-[#001f3f]/30"
            style="opacity: 0; transform: scale(0.2) rotate(0deg);"

          <!-- Hintergrund 2: Lila -->

            id="purpleSquare"

          <!-- 45°-Offset-Quadrat -->

        class="flex items-center justify-center gap-2 px-4 py-2.5 bg-neutral-100 hover:bg-neutral-200 active:scale-95 text-neutral-800 font-semibold text-sm rounded-xl border border-neutral-200 transition duration-200 disabled:opacity-30 disabled:pointer-events-none"

      >
        <svg id="expandIcon" class="w-4 h-4 fill-none stroke-current stroke-2 transition-transform duration-300" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
        </svg>
        <span id="expandBtnText">Expandieren</span>

      <div class="border-t border-neutral-100 my-1 pt-2 flex flex-col gap-2">

          + Weitere Aktion 1

        <button class="px-4 py-2 bg-neutral-50 text-neutral-400 border border-dashed border-neutral-200 rounded-xl text-xs font-medium cursor-not-allowed text-left">

  <script>
    const baseSquare = document.getElementById('baseSquare');
    const idleText = document.getElementById('idleText');
    const welcomeText = document.getElementById('welcomeText');
    const offsetSquare = document.getElementById('offsetSquare');
    const navySquare = document.getElementById('navySquare');
    const purpleSquare = document.getElementById('purpleSquare');
    const loaderIcon = document.getElementById('loaderIcon');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const expandBtn = document.getElementById('expandBtn');
    const expandBtnText = document.getElementById('expandBtnText');
    const expandIcon = document.getElementById('expandIcon');
    const introBtn = document.getElementById('introBtn');

    // UI-Elemente für Startsequenz
    const welcomeTitle = document.getElementById('welcomeTitle');
    const widgetContainer = document.getElementById('widgetContainer');
    const dateHeader = document.getElementById('dateHeader');
    const monthHeader = document.getElementById('monthHeader');
    const weekBar = document.getElementById('weekBar');
    const filterPills = document.getElementById('filterPills');
    const eventCard = document.getElementById('eventCard');
    const bottomNav = document.getElementById('bottomNav');

    const introItemsTopDown = [
      dateHeader,
      monthHeader,
      weekBar,
      filterPills,
      eventCard
    ];

    let state = 'IDLE';
    let isExpanded = false;
    let isIntroPlaying = false;
    let animationFrameId = null;

    let mainAngle = 0;
    let bgAngle = 0;
    let loaderAngle = 0;
    let speedFactor = 0;

    let textProgress = 1;
    let offsetProgress = 0;
    let loaderProgress = 0;
    let bgProgress = 0;

    let lastTimestamp = 0;
    let waveTime = 0;

    let stopStartAngle = 0;
    let stopTargetAngle = 0;
    let stopProgress = 0;

    function lerp(start, end, t) {
      return start + (end - start) * t;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Elastische Federfunktion mit Overshoot für spürbaren Bounce-Effekt
    function easeOutBack(t, overshoot = 1.35) {
      const c1 = overshoot;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function updateLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min((timestamp - lastTimestamp) * 0.001, 0.04);
      lastTimestamp = timestamp;

      if (state === 'STARTING') {
        speedFactor = Math.min(1, speedFactor + dt * 2.2);
        textProgress = Math.max(0, textProgress - dt * 4.0);

        if (speedFactor > 0.15) offsetProgress = Math.min(1, offsetProgress + dt * 1.6);
        if (offsetProgress > 0.4) loaderProgress = Math.min(1, loaderProgress + dt * 1.8);
        if (loaderProgress > 0.5) bgProgress = Math.min(1, bgProgress + dt * 1.4);

        if (bgProgress >= 0.99 && speedFactor >= 1) {
          bgProgress = 1;
          offsetProgress = 1;
          loaderProgress = 1;
          speedFactor = 1;
          textProgress = 0;
          state = 'RUNNING';
          stopBtn.disabled = false;
        }

        waveTime += dt;
        const burstMultiplier = 1.0 + 1.25 * Math.pow(Math.max(0, Math.sin(waveTime * 1.8)), 4);
        mainAngle += 110 * burstMultiplier * speedFactor * dt;
        bgAngle -= 75 * speedFactor * dt;
        loaderAngle += 340 * dt;

      } else if (state === 'RUNNING') {
        waveTime += dt;
        const burstMultiplier = 1.0 + 1.25 * Math.pow(Math.max(0, Math.sin(waveTime * 1.8)), 4);
        mainAngle += 110 * burstMultiplier * dt;
        bgAngle -= 75 * dt;
        loaderAngle += 340 * dt;

      } else if (state === 'STOPPING') {
        bgProgress = Math.max(0, bgProgress - dt * 2.2);
        if (bgProgress < 0.5) loaderProgress = Math.max(0, loaderProgress - dt * 2.5);
        if (loaderProgress < 0.4) offsetProgress = Math.max(0, offsetProgress - dt * 2.2);

        // Sanfter Stopp-Fortschritt
        stopProgress = Math.min(1, stopProgress + dt * 0.95);
        const easedStop = easeOutCubic(stopProgress);

        if (stopProgress > 0.6) {
          textProgress = Math.min(1, textProgress + dt * 2.8);
        }

        // Kontinuierliche lineare Annäherung an den Zielwinkel
        mainAngle = lerp(stopStartAngle, stopTargetAngle, easedStop);
        bgAngle -= 75 * (1 - easedStop) * dt;
        loaderAngle += 340 * (1 - easedStop) * dt;
        if (stopProgress >= 1 && offsetProgress <= 0.01 && bgProgress <= 0.01 && loaderProgress <= 0.01) {
          mainAngle = 0;
          baseSquare.style.transform = `scale(1) rotate(0deg)`;
          
          textProgress = 1;
          idleText.style.opacity = '1';
          offsetSquare.style.opacity = '0';
          loaderIcon.style.opacity = '0';
          navySquare.style.opacity = '0';
          purpleSquare.style.opacity = '0';

          state = 'IDLE';
          speedFactor = 0;
          startBtn.disabled = false;
          stopBtn.disabled = true;
          expandBtn.disabled = false;

          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
          return;
        }
      }

      idleText.style.opacity = textProgress.toFixed(3);

      // Federnder Skalierungseffekt beim Starten und Stoppen
      let activeScale = 1;
      if (state === 'STARTING') {
        // Federt beim Starten elastisch von 1.0 auf ca. 0.80 herunter (Bounce nach innen)
        const springT = easeOutBack(Math.min(1, speedFactor), 1.4);
        activeScale = lerp(1, 0.82, springT);
      } else if (state === 'RUNNING') {
        activeScale = 0.82;
      } else if (state === 'STOPPING') {
        // Federt beim Stoppen elastisch von 0.82 auf 1.0 zurück (mit kleinem Überschwinger)
        const springStop = easeOutBack(Math.min(1, stopProgress), 1.25);
        activeScale = lerp(0.82, 1.0, springStop);
      }
      baseSquare.style.transform = `scale(${activeScale.toFixed(3)}) rotate(${mainAngle.toFixed(2)}deg)`;

      // 45°-Offset-Quadrat
      if (offsetProgress > 0) {
        const easedOffset = easeInOutCubic(offsetProgress);
        offsetSquare.style.opacity = easedOffset.toFixed(3);
        offsetSquare.style.transform = `scale(${lerp(1, activeScale, easedOffset).toFixed(3)}) rotate(${(mainAngle + 45).toFixed(2)}deg)`;
      } else {
        offsetSquare.style.opacity = '0';
      }

      // Lade-Icon
      if (loaderProgress > 0) {
        const easedLoader = easeInOutCubic(loaderProgress);
        loaderIcon.style.opacity = easedLoader.toFixed(3);
        loaderIcon.style.transform = `scale(${lerp(0.5, 0.75, easedLoader).toFixed(3)}) rotate(${loaderAngle.toFixed(2)}deg)`;
      } else {
        loaderIcon.style.opacity = '0';
      }

      // Farbige Quadrate (Navy & Lila)
      if (bgProgress > 0.001) {
        const easedBg = easeInOutCubic(bgProgress);
        const pulseCycle = (Math.sin(waveTime * 2.2) + 1) * 0.5;

        const navyScale = lerp(0.3, lerp(0.70, 0.88, pulseCycle), easedBg);
        navySquare.style.opacity = (lerp(0.2, 0.9, pulseCycle) * easedBg).toFixed(3);
        navySquare.style.transform = `scale(${navyScale.toFixed(3)}) rotate(${bgAngle.toFixed(2)}deg)`;

        const purpleScale = lerp(0.3, lerp(0.70, 0.88, 1 - pulseCycle), easedBg);
        purpleSquare.style.opacity = (lerp(0.2, 0.9, 1 - pulseCycle) * easedBg).toFixed(3);
        purpleSquare.style.transform = `scale(${purpleScale.toFixed(3)}) rotate(${(bgAngle - 25).toFixed(2)}deg)`;
      } else {
        navySquare.style.opacity = '0';
        purpleSquare.style.opacity = '0';
      }

      animationFrameId = requestAnimationFrame(updateLoop);
    }

    function handleStart() {
      if (state !== 'IDLE' || isExpanded) return;
      state = 'STARTING';
      startBtn.disabled = true;
      stopBtn.disabled = true;
      expandBtn.disabled = true;
      lastTimestamp = performance.now();
      
      if (!animationFrameId) {
        animationFrameId = requestAnimationFrame(updateLoop);
      }
    }

    function handleStop() {
      if (state !== 'RUNNING' && state !== 'STARTING') return;
      state = 'STOPPING';
      startBtn.disabled = true;
      stopBtn.disabled = true;
      expandBtn.disabled = true;

      stopStartAngle = mainAngle;
      const minRunout = 180; 
      stopTargetAngle = Math.ceil((stopStartAngle + minRunout) / 360) * 360;
      stopProgress = 0;
    }

    function handleExpandToggle() {
      if (state !== 'IDLE') return;

      isExpanded = !isExpanded;

      if (isExpanded) {
        baseSquare.classList.add('expanded');
        idleText.classList.add('text-slide-out');
        welcomeText.classList.remove('text-welcome-hidden');
        welcomeText.classList.add('text-welcome-visible');
        expandBtnText.textContent = 'Einklappen';
        expandIcon.style.transform = 'rotate(180deg)';
        startBtn.disabled = true;
      } else {
        baseSquare.classList.remove('expanded');
        welcomeText.classList.remove('text-welcome-visible');
        welcomeText.classList.add('text-welcome-hidden');
        idleText.classList.remove('text-slide-out');
        expandBtnText.textContent = 'Expandieren';
        expandIcon.style.transform = 'rotate(0deg)';
        startBtn.disabled = false;
      }
    }

    startBtn.addEventListener('click', handleStart);
    stopBtn.addEventListener('click', handleStop);
    expandBtn.addEventListener('click', handleExpandToggle);

    // Komplette Startanimations-Sequenz
    function playIntroSequence() {
      if (isIntroPlaying) return;
      isIntroPlaying = true;
      introBtn.disabled = true;

      // Falls das Widget expandiert war, sofort einklappen
      if (isExpanded) {
        handleExpandToggle();
      }

      // 1. Initialer Zustand: Alles auf weiß / unsichtbar setzen
      welcomeTitle.innerHTML = '';
      widgetContainer.style.opacity = '0';
      widgetContainer.style.transform = 'scale(0.85)';

      introItemsTopDown.forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-18px)';
      });

      bottomNav.style.opacity = '0';
      bottomNav.style.transform = 'translateY(100%)';

      const fullText = "Frisch in den Tag, Nico!";
      let charIdx = 0;

      // 2. Typewriter: Buchstabe für Buchstabe handgetippt
      function typeNextChar() {
        if (charIdx < fullText.length) {
          welcomeTitle.textContent = fullText.slice(0, charIdx + 1);
          charIdx++;
          const typingDelay = 35 + Math.random() * 35;
          setTimeout(typeNextChar, typingDelay);
        } else {
          // 3. WIDGET-START: Bereits im Unsichtbaren andrehen
          handleStart();

          // Kurz anlaufen lassen, dann schon in voller Drehung sanft einblenden
          setTimeout(() => {
            widgetContainer.style.opacity = '1';
            widgetContainer.style.transform = 'scale(1)';

            // Läuft kurz gedreht weiter und dockt dann sauber ein
            setTimeout(() => {
              handleStop();
            }, 750);

            // 4. Kaskaden-Aufbau von oben nach unten
            introItemsTopDown.forEach((el, index) => {
              setTimeout(() => {
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
              }, 450 + (index * 130));
            });

            // Bottom-Navigation fliegt von unten herein
            setTimeout(() => {
              bottomNav.style.opacity = '1';
              bottomNav.style.transform = 'translateY(0)';
              isIntroPlaying = false;
              introBtn.disabled = false;
            }, 450 + (introItemsTopDown.length * 130) + 120);

          }, 180);
        }
      }

      // Kurze Ruhepause am Anfang vor dem Tippen
      setTimeout(typeNextChar, 250);
    }

    introBtn.addEventListener('click', playIntroSequence);
  </script>
</body>
