<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drehendes Quadrat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Exakter zentraler Dreh- und Ankerpunkt für alle Schichten */
    .widget-anchor {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 140px;
      transform: translate(-50%, -50%);
    }

    /* Alle Quadrate teilen sich exakt denselben geometrischen Raum */
    .square-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 30px;
      transform-origin: center center;
      will-change: transform, opacity;
      contain: layout style paint;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* 
      Elastische Feder-Kurve (Wasserball-Effekt):
      Langsam anlaufen -> schnell beschleunigen -> minimal überschwingen (Overshoot) -> sanft zurückschnellen
    */
    .spring-transition {
      transition: width 0.65s cubic-bezier(0.34, 1.45, 0.54, 1);
    }

    /* 
      Das Haupt-Widget ist fest an der rechten Kante verankert (right: 0).
      Im Idle-Modus (140px) füllt es den Anker 1:1 deckungsgleich mit den anderen Quadraten aus.
      Bei Expansion wächst es ausschließlich nach links (width: 290px).
    */
    #baseSquare {
      right: 0;
      left: auto;
      width: 140px;
    }

    #baseSquare.expanded {
      width: 290px;
    }

    /* Text-Slide-Animationen mit Feder-Dynamik */
    .idle-text-transition {
      transition: transform 0.55s cubic-bezier(0.34, 1.35, 0.54, 1), 
                  opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .welcome-text-transition {
      transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.54, 1), 
                  opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .text-slide-out {
      opacity: 0 !important;
      transform: translate3d(28px, 0, 0) scale(0.96) !important;
      pointer-events: none;
    }

    .text-welcome-hidden {
      opacity: 0;
      transform: translate3d(-32px, 0, 0) scale(0.96);
      pointer-events: none;
    }

    .text-welcome-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: auto;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-between m-0 p-6 select-none overflow-x-hidden font-sans">

  <!-- Info-Badge: Ressourceneffizienz -->
  <div class="flex items-center gap-2 px-3 py-1.5 bg-neutral-50 border border-neutral-200/80 rounded-full text-[11px] text-neutral-500 font-mono tracking-tight shadow-sm">
    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
    <span>GPU-Composited • 0% CPU im Idle • Shared Anchor</span>
  </div>

  <!-- Animations-Bühne -->
  <div id="stageContainer" class="relative w-[360px] h-[320px] flex items-center justify-center">

    <!-- Zentraler 140x140px Widget-Anker: garantiert 100% perfekte Deckungsgleichheit aller Ebenen -->
    <div class="widget-anchor pointer-events-none">

      <!-- Hintergrund-Ebene 1: Navy-Blau (#001f3f) -->
      <div 
        id="navySquare" 
        class="square-layer bg-[#001f3f] shadow-2xl shadow-[#001f3f]/30"
        style="opacity: 0; transform: scale(0.3) rotate(0deg);"
        aria-hidden="true"
      ></div>

      <!-- Hintergrund-Ebene 2: Lila (#7928ca) -->
      <div 
        id="purpleSquare" 
        class="square-layer bg-[#7928ca] shadow-2xl shadow-[#7928ca]/30"
        style="opacity: 0; transform: scale(0.3) rotate(0deg);"
        aria-hidden="true"
      ></div>

      <!-- Zweites versetztes Quadrat (Anthrazit) -->
      <div 
        id="offsetSquare" 
        class="square-layer bg-[#212226] shadow-2xl shadow-black/30 z-10"
        style="opacity: 0; transform: scale(0.6) rotate(45deg);"
        aria-hidden="true"
      ></div>

      <!-- Vorderstes Element: Weißes drehendes Lade-Icon -->
      <div 
        id="loaderIcon" 
        class="square-layer z-20 flex items-center justify-center"
        style="opacity: 0; transform: scale(0.6) rotate(0deg);"
        aria-hidden="true"
      >
        <svg 
          class="w-10 h-10 text-white drop-shadow" 
          viewBox="0 0 24 24" 
          fill="none" 
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle 
            class="opacity-25" 
            cx="12" 
            cy="12" 
            r="9.5" 
            stroke="currentColor" 
            stroke-width="2.75"
          ></circle>
          <path 
            class="opacity-95" 
            fill="currentColor" 
            d="M12 2.5a9.5 9.5 0 0 1 9.5 9.5h-2.5A7 7 0 0 0 12 5V2.5z"
          ></path>
        </svg>
      </div>

      <!-- Basis-Quadrat (Matte Anthrazit-Widget-Farbe mit Feder-Übergang) -->
      <div 
        id="baseSquare" 
        class="square-layer spring-transition bg-[#212226] shadow-2xl shadow-black/30 z-10 p-4 text-white box-border overflow-hidden"
        style="opacity: 1; transform: scale(1) rotate(0deg);"
        role="img" 
        aria-label="Animiertes quadratisches Termin-Widget"
      >
        <!-- Text im Idle-Modus (TERMIN & IN linksbündig, Zeit harmonisch skaliert rechtsbündig mit Padding) -->
        <div 
          id="idleText" 
          class="w-full h-full flex flex-col justify-between select-none idle-text-transition"
          style="opacity: 1; transform: translate3d(0, 0, 0);"
        >
          <!-- Oben links: TERMIN + IN linksbündig -->
          <div class="flex flex-col items-start text-left gap-0">
            <span class="text-[19px] font-black tracking-tight text-white leading-none">TERMIN</span>
            <span class="text-[13px] font-black tracking-widest text-[#9498a3] uppercase leading-tight mt-0.5">IN</span>
          </div>

          <!-- Unten rechts: 3:12h mit sicherem Padding zum Rand (~50px / 26px) -->
          <div class="w-full flex items-baseline justify-end pb-0.5 pr-0.5">
            <span class="text-[50px] font-black tracking-tighter text-white leading-none font-sans">3:12<span class="text-[26px] font-black tracking-tight text-neutral-300 ml-0.5">h</span></span>
          </div>
        </div>

        <!-- Neuer Text bei Expansion: "Willkommen zurück Nico" ganz links -->
        <div 
          id="welcomeText"
          class="absolute inset-0 p-5 flex flex-col justify-center items-start text-welcome-hidden welcome-text-transition delay-100"
        >
          <span class="text-[14px] font-bold tracking-wider text-neutral-400 uppercase leading-snug">Willkommen zurück</span>
          <span class="text-[34px] font-black tracking-tight text-white leading-tight">Nico</span>
        </div>
      </div>

    </div>

  </div>

  <!-- Steuerungselemente -->
  <div class="flex items-center gap-3 z-30 pb-4">
    <button 
      id="startBtn" 
      type="button" 
      class="flex items-center gap-2 px-5 py-2.5 bg-black hover:bg-neutral-800 active:scale-95 text-white font-medium text-sm rounded-full shadow-md transition-all duration-200 cursor-pointer disabled:opacity-30 disabled:pointer-events-none"
    >
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <span>Start</span>
    </button>

    <button 
      id="stopBtn" 
      type="button" 
      disabled
      class="flex items-center gap-2 px-5 py-2.5 bg-neutral-100 hover:bg-neutral-200 active:scale-95 text-neutral-800 font-medium text-sm rounded-full border border-neutral-300 shadow-sm transition-all duration-200 cursor-pointer disabled:opacity-30 disabled:pointer-events-none"
    >
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
        <path d="M6 6h12v12H6z"/>
      </svg>
      <span>Stopp</span>
    </button>

    <!-- Neuer Expansions-Toggle-Button -->
    <button 
      id="expandBtn" 
      type="button" 
      class="flex items-center gap-2 px-5 py-2.5 bg-neutral-900 hover:bg-black active:scale-95 text-white font-medium text-sm rounded-full shadow-md transition-all duration-200 cursor-pointer disabled:opacity-30 disabled:pointer-events-none"
    >
      <svg id="expandIcon" class="w-4 h-4 fill-none stroke-current stroke-2 transition-transform duration-300" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
      <span id="expandBtnText">Expandieren</span>
    </button>
  </div>

  <script>
    // DOM-Referenzen
    const stageContainer = document.getElementById('stageContainer');
    const baseSquare = document.getElementById('baseSquare');
    const idleText = document.getElementById('idleText');
    const welcomeText = document.getElementById('welcomeText');
    const offsetSquare = document.getElementById('offsetSquare');
    const navySquare = document.getElementById('navySquare');
    const purpleSquare = document.getElementById('purpleSquare');
    const loaderIcon = document.getElementById('loaderIcon');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const expandBtn = document.getElementById('expandBtn');
    const expandBtnText = document.getElementById('expandBtnText');
    const expandIcon = document.getElementById('expandIcon');

    // Zustände: 'IDLE' | 'STARTING' | 'RUNNING' | 'STOPPING'
    let state = 'IDLE';
    let isExpanded = false;
    let animationFrameId = null;

    // Rotationswinkel
    let mainAngle = 0;
    let bgAngle = 0;
    let loaderAngle = 0;

    // Geschwindigkeitssteuerung
    let speedFactor = 0;

    // Stufenfortschritte
    let textProgress = 1; // 1 = voll sichtbar, 0 = ausgeblendet
    let offsetProgress = 0;
    let loaderProgress = 0;
    let bgProgress = 0;

    let lastTimestamp = 0;
    let waveTime = 0;

    // Präzise orthogonale Docking-Variablen
    let stopStartAngle = 0;
    let stopTargetAngle = 0;
    let stopProgress = 0; // 0 bis 1

    function lerp(start, end, t) {
      return start + (end - start) * t;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Hauptschleife (läuft NUR, wenn Animation aktiv ist)
    function updateLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min((timestamp - lastTimestamp) * 0.001, 0.04);
      lastTimestamp = timestamp;

      if (state === 'STARTING') {
        speedFactor = lerp(speedFactor, 1, dt * 2.2);

        // Text schnell und geschmeidig ausblenden zu Beginn der Rotation
        textProgress = Math.max(0, textProgress - dt * 4.0);

        if (speedFactor > 0.15) {
          offsetProgress = Math.min(1, offsetProgress + dt * 1.6);
        }
        if (offsetProgress > 0.4) {
          loaderProgress = Math.min(1, loaderProgress + dt * 1.8);
        }
        if (loaderProgress > 0.5) {
          bgProgress = Math.min(1, bgProgress + dt * 1.4);
        }

        if (bgProgress >= 0.99 && speedFactor > 0.95) {
          bgProgress = 1;
          offsetProgress = 1;
          loaderProgress = 1;
          speedFactor = 1;
          textProgress = 0;
          state = 'RUNNING';
          stopBtn.disabled = false;
        }

        // Standard-Rotation während des Starts
        waveTime += dt;
        const burstMultiplier = 1.0 + 1.25 * Math.pow(Math.max(0, Math.sin(waveTime * 1.8)), 4);
        mainAngle += 110 * burstMultiplier * speedFactor * dt;
        bgAngle -= 75 * speedFactor * dt;
        loaderAngle += 340 * dt;

      } else if (state === 'RUNNING') {
        waveTime += dt;
        const burstMultiplier = 1.0 + 1.25 * Math.pow(Math.max(0, Math.sin(waveTime * 1.8)), 4);
        mainAngle += 110 * burstMultiplier * dt;
        bgAngle -= 75 * dt;
        loaderAngle += 340 * dt;

      } else if (state === 'STOPPING') {
        // Phasenweiser Rückzug der Ebenen
        bgProgress = Math.max(0, bgProgress - dt * 2.0);

        if (bgProgress < 0.5) {
          loaderProgress = Math.max(0, loaderProgress - dt * 2.5);
        }
        if (loaderProgress < 0.4) {
          offsetProgress = Math.max(0, offsetProgress - dt * 2.2);
        }

        // Lineare Fortschreitung der Auslaufphase
        stopProgress = Math.min(1, stopProgress + dt * 0.7);
        const easedStop = easeOutCubic(stopProgress);

        // Text blendet kurz vor dem endgültigen Stillstand wieder ein
        if (stopProgress > 0.65) {
          textProgress = Math.min(1, textProgress + dt * 2.8);
        }

        // MATHEMATISCH EXAKTE AUSRICHTUNG: Nähert sich absolut verlässlich stopTargetAngle an
        mainAngle = lerp(stopStartAngle, stopTargetAngle, easedStop);

        // Hintergrundelemente drehen sanft aus
        bgAngle -= 75 * (1 - easedStop) * dt;
        loaderAngle += 340 * (1 - easedStop) * dt;

        // Sobald der Docking-Fortschritt 100% erreicht ist
        if (stopProgress >= 1 && offsetProgress <= 0.01 && bgProgress <= 0.01 && loaderProgress <= 0.01) {
          // EXAKT auf 0° (Vielfaches von 360°) normieren
          mainAngle = 0;
          baseSquare.style.transform = `translate3d(0,0,0) scale(1) rotate(0deg)`;
          
          textProgress = 1;
          idleText.style.opacity = '1';
          offsetSquare.style.opacity = '0';
          loaderIcon.style.opacity = '0';
          navySquare.style.opacity = '0';
          purpleSquare.style.opacity = '0';

          state = 'IDLE';
          speedFactor = 0;
          startBtn.disabled = false;
          stopBtn.disabled = true;
          expandBtn.disabled = false; // Bugfix: Expandieren-Button nach Rotation wieder freigeben

          // RESSOURCEN-MAXIMUM: Animation Frame vollständig stoppen -> 0% CPU & GPU im Ruhezustand
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
          return;
        }
      }

      // 0. Idle-Text Deckkraft aktualisieren
      idleText.style.opacity = textProgress.toFixed(3);

      // 1. Basis-Quadrat rendern
      baseSquare.style.transform = `translate3d(0,0,0) scale(1) rotate(${mainAngle.toFixed(2)}deg)`;

      // 2. 45°-Quadrat rendern
      if (offsetProgress > 0) {
        const easedOffset = easeInOutCubic(offsetProgress);
        offsetSquare.style.opacity = easedOffset.toFixed(3);
        offsetSquare.style.transform = `translate3d(0,0,0) scale(${lerp(0.85, 1, easedOffset).toFixed(3)}) rotate(${(mainAngle + 45).toFixed(2)}deg)`;
      } else {
        offsetSquare.style.opacity = '0';
      }

      // 3. Lade-Icon rendern
      if (loaderProgress > 0) {
        const easedLoader = easeInOutCubic(loaderProgress);
        loaderIcon.style.opacity = easedLoader.toFixed(3);
        loaderIcon.style.transform = `translate3d(0,0,0) scale(${lerp(0.6, 1, easedLoader).toFixed(3)}) rotate(${loaderAngle.toFixed(2)}deg)`;
      } else {
        loaderIcon.style.opacity = '0';
      }

      // 4. Navy & Lila Quadrate rendern
      if (bgProgress > 0.001) {
        const easedBg = easeInOutCubic(bgProgress);
        const pulseCycle = (Math.sin(waveTime * 2.2) + 1) * 0.5;

        const navyScale = lerp(0.4, lerp(0.85, 1.38, pulseCycle), easedBg);
        navySquare.style.opacity = (lerp(0.2, 0.95, pulseCycle) * easedBg).toFixed(3);
        navySquare.style.transform = `translate3d(0,0,0) scale(${navyScale.toFixed(3)}) rotate(${bgAngle.toFixed(2)}deg)`;

        const purpleScale = lerp(0.4, lerp(0.85, 1.38, 1 - pulseCycle), easedBg);
        purpleSquare.style.opacity = (lerp(0.2, 0.95, 1 - pulseCycle) * easedBg).toFixed(3);
        purpleSquare.style.transform = `translate3d(0,0,0) scale(${purpleScale.toFixed(3)}) rotate(${(bgAngle - 25).toFixed(2)}deg)`;
      } else {
        navySquare.style.opacity = '0';
        purpleSquare.style.opacity = '0';
      }

      animationFrameId = requestAnimationFrame(updateLoop);
    }

    // Start-Handler
    function handleStart() {
      if (state === 'STARTING' || state === 'RUNNING' || isExpanded) return;
      state = 'STARTING';
      startBtn.disabled = true;
      stopBtn.disabled = true;
      expandBtn.disabled = true;
      lastTimestamp = performance.now();
      
      if (!animationFrameId) {
        animationFrameId = requestAnimationFrame(updateLoop);
      }
    }

    // Stopp-Handler mit mathematischer Zielberechnung
    function handleStop() {
      if (state !== 'RUNNING' && state !== 'STARTING') return;
      state = 'STOPPING';
      startBtn.disabled = true;
      stopBtn.disabled = true;
      expandBtn.disabled = true;

      // Berechne das exakt nächste Vielfache von 360° (+ min. 240° Nachlaufweg)
      stopStartAngle = mainAngle;
      const minRunout = 240; 
      stopTargetAngle = Math.ceil((stopStartAngle + minRunout) / 360) * 360;
      stopProgress = 0;
    }

    // Expansions-Handler (nach links aufklappen / einklappen)
    function handleExpandToggle() {
      if (state !== 'IDLE') return;

      isExpanded = !isExpanded;

      if (isExpanded) {
        // Expandieren nach links
        baseSquare.classList.add('expanded');
        idleText.classList.add('text-slide-out');
        welcomeText.classList.remove('text-welcome-hidden');
        welcomeText.classList.add('text-welcome-visible');
        expandBtnText.textContent = 'Einklappen';
        expandIcon.style.transform = 'rotate(180deg)';
        startBtn.disabled = true; // Drehung während Expansion sperren
      } else {
        // Einklappen zurück zum 140x140 Quadrat
        baseSquare.classList.remove('expanded');
        welcomeText.classList.remove('text-welcome-visible');
        welcomeText.classList.add('text-welcome-hidden');
        idleText.classList.remove('text-slide-out');
        expandBtnText.textContent = 'Expandieren';
        expandIcon.style.transform = 'rotate(0deg)';
        startBtn.disabled = false; // Drehung wieder freigeben
      }
    }

    startBtn.addEventListener('click', handleStart);
    stopBtn.addEventListener('click', handleStop);
    expandBtn.addEventListener('click', handleExpandToggle);
  </script>
</body>
</html>
