<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tide - Dein Studium im Flow</title>
    
    <!-- Tailwind CSS für einfaches, responsives Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter für eine extrem cleane Typografie -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfdfd; /* Nahezu reines Weiß */
            overflow-x: hidden;
        }

        /* Hintergrund-Blobs */
        .blobs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none; /* Verhindert, dass die Blobs Klicks blockieren */
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px); /* Sehr starker Blur für softe Optik */
            opacity: 0.5;
            animation: float 25s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -10%;
            right: -5%;
            width: 700px;
            height: 700px;
            background-color: #e0f2fe; /* Pastellblau */
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -20%;
            right: 20%;
            width: 800px;
            height: 800px;
            background-color: #dcfce7; /* Mint */
            animation-delay: -5s;
        }

        .blob-3 {
            top: 30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background-color: #f3e8ff; /* Flieder / Sanftes Lila */
            animation-delay: -10s;
            opacity: 0.4;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(50px, -80px) scale(1.1) rotate(45deg); }
            100% { transform: translate(-50px, 50px) scale(0.95) rotate(-15deg); }
        }

        /* Cleanes Eingabefeld */
        .input-line {
            appearance: none;
            background: transparent;
            border: none;
            border-bottom: 1px solid #d1d5db; /* Sehr feine Linie */
            border-radius: 0;
            outline: none;
            padding: 0.5rem 0;
            transition: all 0.3s ease;
        }

        .input-line:focus {
            border-bottom-color: #111827; /* Wird dunkel beim Fokussieren */
        }
        
        .input-error {
            border-bottom-color: #ef4444 !important; /* Rot bei Fehler */
        }

        .input-success {
            border-bottom-color: #10b981 !important; /* Grün bei Erfolg */
        }
    </style>
</head>
<body class="text-gray-900 selection:bg-gray-200">

    <!-- Animierte Hintergrund-Elemente -->
    <div class="blobs-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
</div>

<!-- Hauptinhalt - Asymmetrisch und linksbündig -->
<main class="relative z-10 min-h-screen flex flex-col justify-center">
    
    <!-- Typografisches Logo komplett oben links -->
    <div class="absolute top-8 left-8 md:top-12 md:left-16 lg:left-24">
        <span class="text-sm font-bold tracking-[0.4em] text-gray-900 uppercase">TIDE</span>
    </div>

    <!-- Container mit viel Weißraum nach rechts -->
    <div class="w-full max-w-7xl mx-auto px-8 md:px-16 lg:px-24 py-12 flex flex-col items-start mt-16 md:mt-0">
        
        <div class="max-w-xl w-full">
            
            <!-- Texte -->
            <h1 class="text-5xl md:text-6xl font-medium tracking-tight text-gray-900 mb-12 leading-tight">
                Dein Studium, <br>
                endlich im Flow.
            </h1>
            
            <!-- Formular mit novalidate, um Browser-Popups zu unterdrücken -->
            <form id="tideForm" class="w-full relative mb-16" novalidate>
                
                <div class="relative w-full max-w-sm mb-12">
                    <label for="email" class="sr-only">E-Mail Adresse</label>
                    <!-- Eingabefeld -->
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="name@uni-beispiel.de" 
                        class="input-line w-full text-xl text-gray-800 placeholder-gray-300 font-light"
                        autocomplete="email"
                    >
                    <!-- Custom Fehlermeldung/Status (initial unsichtbar) -->
                    <div 
                        id="statusMessage" 
                        class="absolute left-0 top-full mt-2 text-sm opacity-0 transition-opacity duration-300 pointer-events-none"
                    >
                        <!-- Text wird via JS eingefügt -->
                    </div>
                </div>

                <!-- Eleganter Button (nur Text mit Pfeil) -->
                <button 
                    type="submit" 
                    class="group flex items-center text-gray-900 text-lg tracking-wide hover:text-gray-600 transition-colors duration-300 focus:outline-none"
                >
                    <span class="font-medium mr-4">Weiter</span>
                    <!-- Pfeil-Icon, das sich beim Hovern verschiebt -->
                    <svg class="w-6 h-6 transform transition-transform duration-300 group-hover:translate-x-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                    </svg>
                </button>
                
            </form>

            <!-- Beschreibung unter dem Formular, um den Weg freizumachen -->
            <p class="text-lg text-gray-500 font-light leading-relaxed max-w-md">
                Notizen, Termine und Todos in einer minimalistischen App vereint, um deinen Kopf frei zu halten.
            </p>

        </div>
        
    </div>
</main>

<!-- Custom Validation JavaScript -->
    <script>
        const form = document.getElementById('tideForm');
        const emailInput = document.getElementById('email');
        const statusMessage = document.getElementById('statusMessage');

        // Regex für grundlegende E-Mail-Validierung
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        form.addEventListener('submit', function(e) {
            // Verhindert das Neuladen der Seite
            e.preventDefault();
            
            const emailValue = emailInput.value.trim();

            // Status zurücksetzen
            statusMessage.classList.remove('opacity-100', 'text-red-500', 'text-emerald-500');
            emailInput.classList.remove('input-error', 'input-success');

            if (!emailValue) {
                // Fehler: Feld ist leer
                showStatus('Bitte gib deine E-Mail-Adresse ein.', 'error');
            } else if (!emailRegex.test(emailValue)) {
                // Fehler: Ungültiges Format
                showStatus('Diese E-Mail-Adresse sieht ungültig aus.', 'error');
            } else {
                // Erfolg
                showStatus('Super! Wir haben dir einen Link geschickt.', 'success');
                // Optional: Feld leeren nach Erfolg
                // emailInput.value = ''; 
            }
        });

        // Funktion zum Anzeigen des Status
        function showStatus(message, type) {
            statusMessage.textContent = message;
            
            if (type === 'error') {
                statusMessage.classList.add('text-red-500');
                emailInput.classList.add('input-error');
            } else if (type === 'success') {
                statusMessage.classList.add('text-emerald-500');
                emailInput.classList.add('input-success');
            }

            // Einblenden
            statusMessage.classList.add('opacity-100');
        }

        // Blendet die Fehlermeldung aus, sobald der Nutzer anfängt zu tippen
        emailInput.addEventListener('input', function() {
            if (statusMessage.classList.contains('opacity-100')) {
                statusMessage.classList.remove('opacity-100', 'text-red-500', 'text-emerald-500');
                emailInput.classList.remove('input-error', 'input-success');
            }
        });
    </script>
</body>
</html>
